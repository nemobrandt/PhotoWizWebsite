<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Wiz | Website under development</title>
  <meta name="description" content="The Photo Wiz website is under development. Photo Wiz offers web design, photo editing and video editing in Melbourne. Contact photowizcontact@gmail.com.">
  <meta name="theme-color" content="#161618">
  <link rel="canonical" href="https://photowiz.com.au/">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #F9FBFA;
      color: #44403C;
      display: flex; align-items: center; justify-content: center;
      padding: clamp(10px, 1.6vw, 22px);
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 100%; min-height: calc(100svh - 2 * clamp(10px, 1.6vw, 22px));
      border-radius: clamp(20px, 2.4vw, 34px);
      background: linear-gradient(180deg, #1C1C1E 0%, #151517 55%, #0F0F11 100%);
      border: 1px solid rgba(255, 255, 255, .14);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), 0 12px 28px rgba(0, 0, 0, .14), 0 34px 70px rgba(0, 0, 0, .18);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 48px 24px; color: rgba(255, 255, 255, .78);
    }
    .tag {
      display: inline-block; font-size: .78rem; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
      color: #CDEBD6; background: rgba(255, 255, 255, .08); padding: 6px 14px; border-radius: 999px; margin-bottom: 22px;
    }
    h1 { margin: 0 0 .2em; color: #fff; font-weight: 800; letter-spacing: -.045em; line-height: .95; font-size: clamp(3.2rem, 11vw, 6.5rem); }
    h1 span { color: #CDEBD6; }
    .lead { margin: .6em 0 0; font-size: clamp(1.05rem, 2.4vw, 1.35rem); color: #fff; font-weight: 600; }
    .sub { margin: .5em auto 0; max-width: 32em; font-size: 1rem; line-height: 1.6; }
    .email {
      display: inline-flex; align-items: center; gap: .5em; margin-top: 30px;
      background: #fff; color: #245A3A; text-decoration: none; font-weight: 700;
      padding: .9em 1.6em; border-radius: 999px; box-shadow: 0 10px 26px rgba(0, 0, 0, .35);
      transition: transform .15s ease;
    }
    .email:hover { transform: translateY(-1px); }
    .email svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .meta { margin-top: 44px; font-size: .85rem; color: rgba(255, 255, 255, .5); line-height: 1.8; }
    :focus-visible { outline: 3px solid #fff; outline-offset: 3px; border-radius: 6px; }
  </style>
</head>
<body>
  <main class="card">
    <span class="tag">Under development</span>
    <h1>Photo <span>Wiz</span></h1>
    <p class="lead">Our new website is on its way.</p>
    <p class="sub">Web design, photo editing and video editing in Melbourne. In the meantime, get in touch by email.</p>
    <a class="email" href="mailto:photowizcontact@gmail.com?subject=Enquiry%20-%20Photo%20Wiz">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      photowizcontact@gmail.com
    </a>
    <p class="meta">
      Photo Wiz (Melbourne) &middot; ABN 80 150 760 138<br>
      Owned and operated by Menno Brandt
    </p>
  </main>
</body>
</html>
